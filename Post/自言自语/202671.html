<article>
<blockquote>
<p>我想到一个方案，实现双缓冲的情况下，设置一个原子标志，表示是否在读取，然后写一个类专门负责拷贝数据到ui线程，是一个值一个值地拷贝，读取完更改原子标志表示可写入，此时指针可以写入到另一个缓冲里。在callback中让类进行读取操作。此时数据在ui线程中，组件也在ui线程中，这样组件读取这个类里的缓冲是安全的吗</p>
</blockquote>
<p>一个线程需要读取另一个线程中持续写入的双缓冲时，应该保证数据转移到读取线程中而不是直接读取</p>
