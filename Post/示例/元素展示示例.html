<body>
<a href="{{ site.baseurl }}/Post/示例.html" id="belonging">从属于示例.html</a>
<article>
<h2 id="title-元素展示示例">元素展示示例</h2>
<div class="element-display" id="mycode"><pre class="line-numbers language-cpp"><code class="language-cpp"><span class="token keyword">int</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
<span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token number">0</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span><span aria-hidden="true" class="line-numbers-rows"><span></span><span></span><span></span><span></span></span></code></pre></div>
<p><a class="element-display-open" data-target="mycode" href="#mycode">单独查看</a></p>
<script>(function () {
  function openDisplay(target) {
    var page = window.open('', '_blank');
    if (!page) return;
    var doc = page.document;
    doc.write('<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body></body></html>');
    doc.close();
    var nodes = document.querySelectorAll('link[rel="stylesheet"], style, meta[name="viewport"]');
    Array.prototype.forEach.call(nodes, function (node) {
      var copy = node.cloneNode(true);
      if (copy.tagName === 'LINK') {
        copy.href = node.href;
      }
      doc.head.appendChild(copy);
    });
    doc.title = document.title;
    doc.body.className = document.body.className;
    var article = doc.createElement('article');
    article.appendChild(target.cloneNode(true));
    doc.body.appendChild(article);
  }
  document.addEventListener('click', function (event) {
    var trigger = event.target.closest('.element-display-open');
    if (!trigger) return;
    var target = document.getElementById(trigger.dataset.target);
    if (!target) return;
    event.preventDefault();
    openDisplay(target);
  });
})();</script></article></body>
<script src="{{ site.baseurl }}/defaultscript.js"></script>

</html>
